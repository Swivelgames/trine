[package]
name = "trine"
version = "0.0.2"
edition = "2024"
license = "MIT"
repository = "https://github.com/Swivelgames/Trine"
readme = "README.md"
description = "Typed actions and views for CLI, JSON-RPC and MCP applications"
keywords = ["cli", "cli-framework", "mcp", "json-rpc", "ipc"]
categories = ["command-line-interface", "development-tools"]
exclude = ["/.github/social-preview.jpg"]

[dependencies]
base64 = "0.22"
async-channel = "2.5"
clap = { version = "4.5", default-features = false, features = ["std", "help", "usage", "error-context", "string"] }
futures-lite = "2.6"
schemars = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
smol = "2.0"
inquire = { version = "0.9.4", default-features = false, features = ["crossterm"], optional = true }
clap_complete = { version = "=4.6.12", default-features = false, features = ["unstable-dynamic"] }
clap_lex = "1.0"

[dev-dependencies]
ctrlc = "3.5"

[target.'cfg(unix)'.dependencies]
async-io = "2.6"
rustix = { version = "1.1", features = ["fs"] }

[features]
cli-confirmation = ["dep:inquire"]

[package.metadata.docs.rs]
all-features = true

[[example]]
name = "decisions"
required-features = ["cli-confirmation"]
